<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f9fa">
    <title>Offline · Wallet</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: #f8f9fa; color: #202124; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px 20px; text-align: center; }
        img { width: 64px; height: 64px; margin-bottom: 8px; border-radius: 16px; }
        h1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
        p { margin: 0; max-width: 310px; font-size: 13px; line-height: 18px; color: #5f6368; }
        button { margin-top: 16px; width: 100%; max-width: 350px; height: 48px; border: 0; border-radius: 12px; background: #1a73e8; color: #fff; font: inherit; font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="" width="64" height="64">
        <h1>You're offline</h1>
        <p>Wallet needs a connection to show and save your money. Nothing was changed. Reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
